<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="PENUMBRA">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#35d4ce" stop-opacity="0.95"/>
      <stop offset="55%"  stop-color="#35d4ce" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff5fa2" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#35d4ce" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff5fa2" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#35d4ce"/>
      <stop offset="100%" stop-color="#0d7f7c"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ground -->
  <rect width="900" height="320" fill="#0b0f14" rx="18"/>

  <!-- guard: mark group -->
  <g filter="url(#glow)">
    <!-- light cone from lens to wall -->
    <polygon points="128,160 300,52 300,268" fill="url(#beam)" opacity="0.85"/>
    <polygon points="128,160 300,86 300,234" fill="url(#beam)" opacity="0.45"/>
    <!-- the wall: three offset layers = palimpsest -->
    <rect x="300" y="52"  width="16" height="216" fill="url(#wall)" opacity="0.30"/>
    <rect x="322" y="66"  width="16" height="188" fill="url(#wall)" opacity="0.55"/>
    <rect x="344" y="80"  width="16" height="160" fill="url(#wall)" opacity="0.90"/>
    <!-- lens -->
    <circle cx="112" cy="160" r="26" fill="url(#lens)"/>
    <circle cx="112" cy="160" r="40" fill="none" stroke="#35d4ce" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- wordmark -->
  <text x="410" y="168" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="10" fill="#f2f7f8">PENUMBRA</text>
  <text x="413" y="206" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="17" font-weight="400" letter-spacing="6.5" fill="#35d4ce" opacity="0.9">
    UNDERSTAND THE OLD LIGHT
  </text>
  <line x1="413" y1="130" x2="880" y2="130" stroke="#ff5fa2" stroke-width="1.5" opacity="0.35"/>
</svg>
